<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4e78">
<link rel="manifest" href="manifest.webmanifest">
<title>時薪制請假紀錄</title>
<style>
:root{--blue:#1f4e78;--light:#d9eaf7;--bg:#f4f7fb;--line:#d8dee8;--red:#b42318}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:#17202a}
header{background:var(--blue);color:#fff;padding:15px 16px;font-size:20px;font-weight:700;text-align:center}
main{max-width:760px;margin:auto;padding:12px 12px 100px}
.card{background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 2px 12px #0000000d}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:#f7fbff;border:1px solid #e1edf7;border-radius:12px;padding:10px}
.kpi b{display:block;font-size:13px;color:#557}.kpi span{display:block;font-size:21px;font-weight:700;margin-top:4px}
label{display:block;font-size:13px;color:#566;margin:9px 0 5px}
input,select,button{font:inherit}
input,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;background:#fff}
button{border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer}
.primary{background:var(--blue);color:#fff}.secondary{background:#eaf2f8;color:#173f62}.danger{background:#fee4e2;color:var(--red)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1;min-width:110px}
.tablewrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:12px}
table{width:100%;min-width:620px;border-collapse:collapse;font-size:14px}
th,td{padding:9px 6px;border-bottom:1px solid #e6eaf0;text-align:left;position:static!important}
th{background:var(--light);color:#173f62}.num{text-align:right}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#edf5fb}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:#fff;color:#456;border-radius:0;padding:13px 4px;font-size:13px}.active{color:var(--blue);font-weight:800}
.hidden{display:none!important}.section-title{font-size:18px;font-weight:800;color:#173f62;margin:2px 0 10px}
.muted{color:#6b7280;font-size:13px}.money{color:#174a2e}
@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}table{min-width:650px}}
</style>
</head>
<body>
<header>時薪制員工請假紀錄表（台灣）</header>
<main>
<section id="home">
 <div class="card"><div class="section-title">月份總覽</div>
  <label>月份</label><input id="monthPick" type="month">
  <div class="grid" style="margin-top:12px">
   <div class="kpi"><b>應上班天數</b><span id="workDays">0</span></div>
   <div class="kpi"><b>國定假日天數</b><span id="holidayDays">0</span></div>
   <div class="kpi"><b>應領薪資</b><span id="gross" class="money">$0</span></div>
   <div class="kpi"><b>實際薪資</b><span id="net" class="money">$0</span></div>
  </div>
 </div>
 <div class="card"><div class="section-title">本月請假</div>
  <div class="grid">
   <div class="kpi"><b>請假次數</b><span id="leaveCount">0</span></div>
   <div class="kpi"><b>請假時數</b><span id="leaveHours">0</span></div>
   <div class="kpi"><b>應給薪資</b><span id="paidLeave">$0</span></div>
   <div class="kpi"><b>扣薪金額</b><span id="deduct">$0</span></div>
  </div>
 </div>
</section>

<section id="add" class="hidden"><div class="card">
 <div class="section-title">新增請假</div>
 <label>日期</label><input id="leaveDate" type="date">
 <label>假別</label><select id="leaveType"></select>
 <label>請假時數</label><input id="hours" type="number" min="0" step="0.5" placeholder="例如 8">
 <label>證明／單號</label><input id="proof" type="text" placeholder="可留空">
 <label>備註</label><input id="note" type="text" placeholder="可留空">
 <div class="actions"><button class="primary" id="saveLeaveBtn">儲存請假</button></div>
 <p class="muted">星期、時薪、給薪比例、應給薪資與扣薪金額會自動計算。</p>
</div></section>

<section id="records" class="hidden"><div class="card">
 <div class="section-title">月份紀錄</div>
 <label>觀看月份</label><input id="recordMonthPick" type="month">
 <div class="tablewrap"><table><thead><tr><th>日期</th><th>星期</th><th>假別</th><th>時數</th><th>扣薪</th><th></th></tr></thead><tbody id="recordBody"></tbody></table></div>
</div></section>

<section id="annual" class="hidden"><div class="card">
 <div class="section-title">年度請假統計</div>
 <label>統計年度</label><input id="yearPick" type="number" min="2020" max="2100">
 <div class="tablewrap"><table><thead><tr><th>假別</th><th>次數</th><th>時數</th><th>應給</th><th>扣薪</th><th>8小時日數</th></tr></thead><tbody id="annualBody"></tbody></table></div>
</div></section>

<section id="settings" class="hidden">
 <div class="card">
  <div class="section-title">台灣國定假日</div>
  <div class="kpi"><b>假日資料狀態</b><span id="holidayStatus" style="font-size:15px">讀取中</span></div>
  <div class="actions"><button class="primary" id="holidayBtn">更新國定假日</button></div>
  <p class="muted">為避免 iPhone／GitHub Pages 跨網站連線失敗，本版直接使用已核對的行政院人事行政總處 2026 年資料，不再由手機直接連政府 API。</p>
  <hr style="border:0;border-top:1px solid #e6eaf0;margin:16px 0">
  <div class="section-title">薪資設定</div>
  <div class="grid">
   <div><label>目前時薪</label><input id="hourly" type="number"></div>
   <div><label>每日工時</label><input id="dailyHours" type="number"></div>
   <div><label>勞保</label><input id="labor" type="number"></div>
   <div><label>健保</label><input id="health" type="number"></div>
   <div><label>福利金</label><input id="welfare" type="number"></div>
   <div><label>其他扣款</label><input id="otherDeduct" type="number"></div>
  </div>
  <div class="actions"><button class="primary" id="saveSettingsBtn">儲存設定</button><button class="secondary" id="csvBtn">匯出CSV</button></div>
 </div>
 <div class="card"><div class="section-title">資料備份</div>
  <div class="actions"><button class="secondary" id="backupBtn">下載備份</button><button class="secondary" id="restoreBtn">還原備份</button></div>
  <input id="restoreFile" class="hidden" type="file" accept=".json">
  <p class="muted">資料儲存在這台手機／瀏覽器。換手機前請先下載備份。</p>
 </div>
</section>
</main>

<nav>
<button data-tab="home" class="active">首頁</button>
<button data-tab="add">新增請假</button>
<button data-tab="records">月份紀錄</button>
<button data-tab="annual">年度統計</button>
<button data-tab="settings">設定</button>
</nav>

<script>
const DEFAULT_SETTINGS={hourly:196,dailyHours:8,labor:758,health:470,welfare:141,otherDeduct:3};
const DEFAULT_TYPES=[
 ["事假",0],["普通傷病假",0.5],["生理假",0.5],["特別休假",1],["婚假",1],["喪假",1],
 ["公假",1],["公傷病假",1],["家庭照顧假",0],["產檢假/陪產檢及陪產假",1],["其他",0]
];
const OFFICIAL_2026=["2026-01-01","2026-02-16","2026-02-17","2026-02-18","2026-02-19","2026-02-20","2026-02-27","2026-04-03","2026-04-06","2026-05-01","2026-06-19","2026-09-25","2026-09-28","2026-10-09","2026-10-26","2026-12-25"];
const $=id=>document.getElementById(id);
const money=n=>"$"+Math.round(Number(n)||0).toLocaleString("zh-TW");

function safeLoad(){
 let raw={};
 try{raw=JSON.parse(localStorage.getItem("twLeaveApp")||"{}")||{}}catch(e){}
 const settings={...DEFAULT_SETTINGS,...(raw.settings||{})};
 for(const k in DEFAULT_SETTINGS){
   const v=Number(settings[k]);
   settings[k]=Number.isFinite(v)?v:DEFAULT_SETTINGS[k];
 }
 let types=Array.isArray(raw.types)?raw.types.filter(x=>Array.isArray(x)&&x[0]):[];
 const old=new Map(types.map(x=>[x[0],x]));
 types=DEFAULT_TYPES.map(x=>old.get(x[0])||[x[0],x[1]]);
 let holidays=Array.isArray(raw.holidays)?raw.holidays.filter(x=>typeof x==="string"):[];
 // 永遠補回 2026 官方資料，不動其他年度
 holidays=holidays.filter(x=>!x.startsWith("2026-")).concat(OFFICIAL_2026);
 holidays=[...new Set(holidays)].sort();
 return {settings,types,holidays,leaves:Array.isArray(raw.leaves)?raw.leaves:[],holidaySync:raw.holidaySync||null};
}
let data=safeLoad();
function persist(){localStorage.setItem("twLeaveApp",JSON.stringify(data))}
persist();

function todayMonth(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`}
function todayDate(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function weekday(s){const d=new Date(s+"T12:00:00");return ["週日","週一","週二","週三","週四","週五","週六"][d.getDay()]}
function rateFor(type){const x=data.types.find(t=>t[0]===type);return x?Number(x[1])||0:0}
function calc(l){const rate=rateFor(l.type),hours=Number(l.hours)||0,hourly=Number(data.settings.hourly)||0;return {rate,paid:hours*hourly*rate,deduct:hours*hourly*(1-rate)}}

function fillLeaveTypes(){
 $("leaveType").innerHTML=data.types.map(x=>`<option value="${x[0]}">${x[0]}</option>`).join("");
}
function loadSettings(){
 for(const k of Object.keys(DEFAULT_SETTINGS)) $(k).value=data.settings[k];
}
function workdays(month){
 if(!month)return [0,0];
 const [y,m]=month.split("-").map(Number),last=new Date(y,m,0).getDate();let work=0,hol=0;
 for(let d=1;d<=last;d++){
  const s=`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  const wd=new Date(s+"T12:00:00").getDay(),isHol=data.holidays.includes(s);
  if(isHol)hol++;
  if(wd!==0&&wd!==6&&!isHol)work++;
 }
 return [work,hol];
}
function refreshHome(){
 const m=$("monthPick").value||todayMonth();
 if(!$("monthPick").value)$("monthPick").value=m;
 const ls=data.leaves.filter(x=>String(x.date||"").startsWith(m));
 const [wd,hd]=workdays(m);
 let hours=0,paid=0,deduct=0;
 ls.forEach(l=>{hours+=Number(l.hours)||0;const c=calc(l);paid+=c.paid;deduct+=c.deduct});
 const gross=wd*(Number(data.settings.dailyHours)||8)*(Number(data.settings.hourly)||0);
 const fixed=(Number(data.settings.labor)||0)+(Number(data.settings.health)||0)+(Number(data.settings.welfare)||0)+(Number(data.settings.otherDeduct)||0);
 $("workDays").textContent=wd;$("holidayDays").textContent=hd;$("gross").textContent=money(gross);$("net").textContent=money(gross-deduct-fixed);
 $("leaveCount").textContent=ls.length;$("leaveHours").textContent=hours.toFixed(2);$("paidLeave").textContent=money(paid);$("deduct").textContent=money(deduct);
}
function renderRecords(){
 const m=$("recordMonthPick").value||todayMonth();
 if(!$("recordMonthPick").value)$("recordMonthPick").value=m;
 const ls=data.leaves.filter(x=>String(x.date||"").startsWith(m)).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
 $("recordBody").innerHTML=ls.length?ls.map(l=>{const c=calc(l);return `<tr><td>${l.date}</td><td>${weekday(l.date)}</td><td><span class="pill">${l.type}</span></td><td class="num">${Number(l.hours||0).toFixed(2)}</td><td class="num">${money(c.deduct)}</td><td><button class="danger" data-del="${l.id}">刪除</button></td></tr>`}).join(""):`<tr><td colspan="6" style="text-align:center;padding:24px">此月份尚無請假紀錄</td></tr>`;
}
function renderAnnual(){
 const y=Number($("yearPick").value)||new Date().getFullYear();
 $("annualBody").innerHTML=data.types.map(t=>{
  const ls=data.leaves.filter(x=>String(x.date||"").startsWith(y+"-")&&x.type===t[0]);let h=0,p=0,d=0;
  ls.forEach(x=>{const c=calc(x);h+=Number(x.hours)||0;p+=c.paid;d+=c.deduct});
  return `<tr><td>${t[0]}</td><td class="num">${ls.length}</td><td class="num">${h.toFixed(2)}</td><td class="num">${money(p)}</td><td class="num">${money(d)}</td><td class="num">${(h/(Number(data.settings.dailyHours)||8)).toFixed(2)}</td></tr>`;
 }).join("");
}
function refreshAll(){refreshHome();renderRecords();renderAnnual()}

function showTab(id,btn){
 document.querySelectorAll("main section").forEach(s=>s.classList.add("hidden"));
 $(id).classList.remove("hidden");
 document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");
 if(id==="add")fillLeaveTypes();
 if(id==="settings")loadSettings();
 refreshAll();
 window.scrollTo(0,0);
}
function saveLeave(){
 const date=$("leaveDate").value,type=$("leaveType").value,h=Number($("hours").value);
 if(!date||!type||!(h>0)){alert("請填入日期、假別及請假時數");return}
 data.leaves.push({id:String(Date.now()),date,type,hours:h,proof:$("proof").value,note:$("note").value});
 persist();$("monthPick").value=date.slice(0,7);$("recordMonthPick").value=date.slice(0,7);$("hours").value="";$("proof").value="";$("note").value="";refreshAll();alert("已儲存");
}
function saveSettings(){
 for(const k of Object.keys(DEFAULT_SETTINGS)){const v=Number($(k).value);data.settings[k]=Number.isFinite(v)?v:DEFAULT_SETTINGS[k]}
 persist();loadSettings();refreshAll();alert("設定已儲存");
}
function updateHoliday(){
 data.holidays=(data.holidays||[]).filter(x=>!x.startsWith("2026-")).concat(OFFICIAL_2026);
 data.holidays=[...new Set(data.holidays)].sort();
 data.holidaySync={updatedAt:new Date().toISOString(),years:[2026],source:"行政院人事行政總處 115年辦公日曆表（內建）"};
 persist();showHolidayStatus();refreshAll();alert("2026 年國定假日資料已更新完成");
}
function showHolidayStatus(){
 const s=data.holidaySync;
 $("holidayStatus").textContent=s?`已更新 2026 年｜${new Date(s.updatedAt).toLocaleString("zh-TW")}`:"2026 年官方資料已內建";
}
function download(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportCSV(){const rows=[["日期","星期","假別","請假時數","時薪","給薪比例","應給薪資","扣薪金額","證明/單號","備註"]];data.leaves.forEach(l=>{const c=calc(l);rows.push([l.date,weekday(l.date),l.type,l.hours,data.settings.hourly,c.rate,c.paid,c.deduct,l.proof||"",l.note||""])});download("請假紀錄.csv","\ufeff"+rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n"),"text/csv;charset=utf-8")}
function backupJSON(){download("時薪制請假APP備份.json",JSON.stringify(data,null,2),"application/json")}
function restoreJSON(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{localStorage.setItem("twLeaveApp",r.result);data=safeLoad();persist();fillLeaveTypes();loadSettings();refreshAll();showHolidayStatus();alert("備份已還原")}catch(e){alert("備份檔格式錯誤")}};r.readAsText(f)}

document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>showTab(b.dataset.tab,b)));
$("saveLeaveBtn").addEventListener("click",saveLeave);
$("saveSettingsBtn").addEventListener("click",saveSettings);
$("holidayBtn").addEventListener("click",updateHoliday);
$("csvBtn").addEventListener("click",exportCSV);
$("backupBtn").addEventListener("click",backupJSON);
$("restoreBtn").addEventListener("click",()=>$("restoreFile").click());
$("restoreFile").addEventListener("change",e=>restoreJSON(e.target));
$("monthPick").addEventListener("change",refreshHome);
$("recordMonthPick").addEventListener("change",renderRecords);
$("yearPick").addEventListener("input",renderAnnual);
$("recordBody").addEventListener("click",e=>{const id=e.target.dataset.del;if(id&&confirm("確定刪除這筆請假紀錄？")){data.leaves=data.leaves.filter(x=>x.id!==id);persist();refreshAll()}});

function init(){
 $("monthPick").value=todayMonth();$("recordMonthPick").value=todayMonth();$("yearPick").value=new Date().getFullYear();$("leaveDate").value=todayDate();
 fillLeaveTypes();loadSettings();showHolidayStatus();refreshAll();
}
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
init();
</script>
</body></html>
