<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4e78">
<link rel="manifest" href="manifest.webmanifest">
<title>時薪制請假紀錄</title>
<style>
:root{--blue:#1f4e78;--light:#d9eaf7;--pale:#fff2cc;--green:#e2f0d9;--bg:#f4f7fb;--line:#d8dee8;--red:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:#17202a}
header{position:sticky;top:0;z-index:5;background:var(--blue);color:white;padding:15px 16px;font-size:20px;font-weight:700;text-align:center}
main{max-width:760px;margin:auto;padding:12px 12px 86px}.card{background:white;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 2px 12px #0000000d}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpi{background:#f7fbff;border:1px solid #e1edf7;border-radius:12px;padding:10px}.kpi b{display:block;font-size:13px;color:#557}.kpi span{display:block;font-size:21px;font-weight:700;margin-top:4px}
label{display:block;font-size:13px;color:#566;margin:9px 0 5px}input,select,button{font:inherit}input,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;background:white}
button{border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:white}.secondary{background:#eaf2f8;color:#173f62}.danger{background:#fee4e2;color:var(--red)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1;min-width:110px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px 6px;border-bottom:1px solid #e6eaf0;text-align:left}th{background:var(--light);color:#173f62;position:sticky;top:55px}.num{text-align:right}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#edf5fb}
nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex;z-index:8;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:white;color:#456;border-radius:0;padding:13px 4px;font-size:13px}.active{color:var(--blue);font-weight:800}
.hidden{display:none}.section-title{font-size:18px;font-weight:800;color:#173f62;margin:2px 0 10px}.muted{color:#6b7280;font-size:13px}.money{color:#174a2e}.warn{color:#8a4b08}
@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}th:nth-child(4),td:nth-child(4){display:none}}
</style>
</head>
<body>
<header>時薪制員工請假紀錄表（台灣）</header>
<main>
<section id="home">
  <div class="card">
    <div class="section-title">月份總覽</div>
    <label>月份</label><input id="monthPick" type="month">
    <div class="grid" style="margin-top:12px">
      <div class="kpi"><b>應上班天數</b><span id="workDays">0</span></div>
      <div class="kpi"><b>國定假日天數</b><span id="holidayDays">0</span></div>
      <div class="kpi"><b>應領薪資</b><span id="gross" class="money">$0</span></div>
      <div class="kpi"><b>實際薪資</b><span id="net" class="money">$0</span></div>
    </div>
  </div>
  <div class="card">
    <div class="section-title">本月請假</div>
    <div class="grid">
      <div class="kpi"><b>請假次數</b><span id="leaveCount">0</span></div>
      <div class="kpi"><b>請假時數</b><span id="leaveHours">0</span></div>
      <div class="kpi"><b>應給薪資</b><span id="paidLeave">$0</span></div>
      <div class="kpi"><b>扣薪金額</b><span id="deduct">$0</span></div>
    </div>
  </div>
</section>

<section id="add" class="hidden">
  <div class="card">
    <div class="section-title">新增請假</div>
    <label>日期</label><input id="leaveDate" type="date">
    <label>假別</label><select id="leaveType"></select>
    <label>請假時數</label><input id="hours" type="number" min="0" step="0.5" placeholder="例如 8">
    <label>證明／單號</label><input id="proof" type="text" placeholder="可留空">
    <label>備註</label><input id="note" type="text" placeholder="可留空">
    <div class="actions"><button class="primary" onclick="saveLeave()">儲存請假</button></div>
    <p class="muted">星期、時薪、給薪比例、應給薪資與扣薪金額會自動計算。</p>
  </div>
</section>

<section id="records" class="hidden">
  <div class="card">
    <div class="section-title">月份紀錄</div>
    <div style="overflow:auto"><table><thead><tr><th>日期</th><th>星期</th><th>假別</th><th>時數</th><th>扣薪</th><th></th></tr></thead><tbody id="recordBody"></tbody></table></div>
  </div>
</section>

<section id="annual" class="hidden">
  <div class="card">
    <div class="section-title">年度請假統計</div>
    <label>統計年度</label><input id="yearPick" type="number" min="2020" max="2100">
    <div style="overflow:auto;margin-top:12px"><table><thead><tr><th>假別</th><th>次數</th><th>時數</th><th>應給</th><th>扣薪</th><th>8小時日數</th></tr></thead><tbody id="annualBody"></tbody></table></div>
  </div>
</section>

<section id="settings" class="hidden">
  <div class="card">
    <div class="section-title">薪資設定</div>
    <div class="grid">
      <div><label>目前時薪</label><input id="hourly" type="number"></div>
      <div><label>每日工時</label><input id="dailyHours" type="number"></div>
      <div><label>勞保</label><input id="labor" type="number"></div>
      <div><label>健保</label><input id="health" type="number"></div>
      <div><label>福利金</label><input id="welfare" type="number"></div>
      <div><label>其他扣款</label><input id="otherDeduct" type="number"></div>
    </div>
    <div class="actions"><button class="primary" onclick="saveSettings()">儲存設定</button><button class="secondary" onclick="exportCSV()">匯出CSV</button></div>
  </div>
  <div class="card">
    <div class="section-title">資料備份</div>
    <div class="actions"><button class="secondary" onclick="backupJSON()">下載備份</button><button class="secondary" onclick="document.getElementById('restoreFile').click()">還原備份</button></div>
    <input id="restoreFile" class="hidden" type="file" accept=".json" onchange="restoreJSON(this)">
    <p class="muted">資料預設儲存在這台手機／瀏覽器。換手機前請先下載備份。</p>
  </div>
</section>
</main>

<nav>
<button onclick="showTab('home',this)" class="active">首頁</button>
<button onclick="showTab('add',this)">新增請假</button>
<button onclick="showTab('records',this)">月份紀錄</button>
<button onclick="showTab('annual',this)">年度統計</button>
<button onclick="showTab('settings',this)">設定</button>
</nav>

<script>
const DEFAULT_TYPES=[
 ["事假",0],["普通傷病假",0.5],["生理假",0.5],["特別休假",1],["婚假",1],["喪假",1],
 ["公假",1],["公傷病假",1],["家庭照顧假",0],["產檢假/陪產檢及陪產假",1],["其他",0]
];
const HOLIDAYS_2026=["2026-01-01","2026-02-16","2026-02-17","2026-02-18","2026-02-19","2026-02-20","2026-02-27","2026-04-03","2026-04-06","2026-05-01","2026-06-19","2026-09-25","2026-09-28","2026-10-09","2026-10-26","2026-12-25"];
let data=JSON.parse(localStorage.getItem("twLeaveApp")||"null")||{
 settings:{hourly:196,dailyHours:8,labor:758,health:470,welfare:141,otherDeduct:3},
 types:DEFAULT_TYPES, holidays:HOLIDAYS_2026, leaves:[]
};
const $=id=>document.getElementById(id), money=n=>"$"+Math.round(n||0).toLocaleString("zh-TW");
function persist(){localStorage.setItem("twLeaveApp",JSON.stringify(data))}
function todayMonth(){let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function weekday(s){let d=new Date(s+"T12:00:00"),a=["週日","週一","週二","週三","週四","週五","週六"];return a[d.getDay()]}
function showTab(id,btn){document.querySelectorAll("main section").forEach(x=>x.classList.add("hidden"));$(id).classList.remove("hidden");document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));btn.classList.add("active");refresh()}
function init(){
 $("monthPick").value=todayMonth(); $("yearPick").value=new Date().getFullYear();
 $("leaveDate").value=new Date().toISOString().slice(0,10);
 $("leaveType").innerHTML=data.types.map(x=>`<option>${x[0]}</option>`).join("");
 loadSettings(); refresh();
}
function workdays(month){
 let [y,m]=month.split("-").map(Number), last=new Date(y,m,0).getDate(), n=0,h=0;
 for(let d=1;d<=last;d++){let s=`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`,dt=new Date(s+"T12:00:00"),wd=dt.getDay(),isHol=data.holidays.includes(s);if(isHol)h++;if(wd!==0&&wd!==6&&!isHol)n++}
 return [n,h]
}
function monthLeaves(){let m=$("monthPick").value;return data.leaves.filter(x=>x.date.startsWith(m))}
function calc(l){let rate=(data.types.find(x=>x[0]===l.type)||["",0])[1],h=+l.hours||0,hr=+data.settings.hourly||0;return {rate,paid:h*hr*rate,deduct:h*hr*(1-rate)}}
function refresh(){
 let m=$("monthPick").value||todayMonth(), [wd,hd]=workdays(m), ls=monthLeaves(), hours=0,paid=0,ded=0;
 ls.forEach(l=>{let c=calc(l);hours+=+l.hours||0;paid+=c.paid;ded+=c.deduct});
 let gross=wd*(+data.settings.dailyHours||8)*(+data.settings.hourly||0);
 let net=gross-ded-(+data.settings.labor||0)-(+data.settings.health||0)-(+data.settings.welfare||0)-(+data.settings.otherDeduct||0);
 $("workDays").textContent=wd;$("holidayDays").textContent=hd;$("gross").textContent=money(gross);$("net").textContent=money(net);
 $("leaveCount").textContent=ls.length;$("leaveHours").textContent=hours.toFixed(2);$("paidLeave").textContent=money(paid);$("deduct").textContent=money(ded);
 $("recordBody").innerHTML=ls.sort((a,b)=>a.date.localeCompare(b.date)).map(l=>{let c=calc(l);return `<tr><td>${l.date}</td><td>${weekday(l.date)}</td><td><span class="pill">${l.type}</span></td><td class="num">${(+l.hours).toFixed(2)}</td><td class="num">${money(c.deduct)}</td><td><button class="danger" onclick="delLeave('${l.id}')">刪除</button></td></tr>`}).join("")||'<tr><td colspan="6" class="muted">本月尚無請假紀錄</td></tr>';
 renderAnnual();
}
function saveLeave(){
 let date=$("leaveDate").value,type=$("leaveType").value,h=+$("hours").value;
 if(!date||!type||!(h>0)){alert("請填入日期、假別及請假時數");return}
 data.leaves.push({id:Date.now().toString(),date,type,hours:h,proof:$("proof").value,note:$("note").value});
 persist(); $("monthPick").value=date.slice(0,7);$("hours").value="";$("proof").value="";$("note").value="";refresh();alert("已儲存");
}
function delLeave(id){if(confirm("確定刪除這筆請假紀錄？")){data.leaves=data.leaves.filter(x=>x.id!==id);persist();refresh()}}
function loadSettings(){for(let k of ["hourly","dailyHours","labor","health","welfare","otherDeduct"])$(k).value=data.settings[k]}
function saveSettings(){for(let k of ["hourly","dailyHours","labor","health","welfare","otherDeduct"])data.settings[k]=+$(`${k}`).value||0;persist();refresh();alert("設定已儲存")}
function renderAnnual(){
 let y=+$("yearPick").value||new Date().getFullYear(), rows=data.types.map(t=>{let ls=data.leaves.filter(x=>x.date.startsWith(y+"-")&&x.type===t[0]),h=0,p=0,d=0;ls.forEach(x=>{let c=calc(x);h+=+x.hours;p+=c.paid;d+=c.deduct});return `<tr><td>${t[0]}</td><td class="num">${ls.length}</td><td class="num">${h.toFixed(2)}</td><td class="num">${money(p)}</td><td class="num">${money(d)}</td><td class="num">${(h/(+data.settings.dailyHours||8)).toFixed(2)}</td></tr>`});
 $("annualBody").innerHTML=rows.join("")
}
$("monthPick").addEventListener("change",refresh);$("yearPick").addEventListener("input",renderAnnual);
function download(name,text,type){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function exportCSV(){let rows=[["日期","星期","假別","請假時數","時薪","給薪比例","應給薪資","扣薪金額","證明/單號","備註"]];data.leaves.forEach(l=>{let c=calc(l);rows.push([l.date,weekday(l.date),l.type,l.hours,data.settings.hourly,c.rate,c.paid,c.deduct,l.proof||"",l.note||""])});download("請假紀錄.csv","\ufeff"+rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n"),"text/csv;charset=utf-8")}
function backupJSON(){download("時薪制請假APP備份.json",JSON.stringify(data,null,2),"application/json")}
function restoreJSON(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);persist();loadSettings();refresh();alert("備份已還原")}catch(e){alert("備份檔格式錯誤")}};r.readAsText(f)}
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
init();
</script>
</body>
</html>
